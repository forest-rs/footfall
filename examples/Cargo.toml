[package]
name = "footfall_examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Runnable examples for Footfall: instrumenting, serving, attaching, and showing a capture live in Tracy."

[dependencies]
anstream.workspace = true
anstyle.workspace = true
clap = { features = ["derive"], workspace = true }
footfall = { features = [
    "analysis",
    "export",
    "runtime",
    "session",
    "std",
    "tracing",
    "tracy",
    "wtransport",
], workspace = true }
footfall_fanout.workspace = true
footfall_memory = { features = ["std"], workspace = true }
tokio = { features = ["macros", "rt-multi-thread", "signal", "sync", "time"], workspace = true }
tracing.workspace = true
tracing-subscriber = { features = ["registry", "std"], workspace = true }

[lints]
workspace = true
