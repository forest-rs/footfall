[package]
name = "footfall_examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Runnable examples for Footfall: instrumenting, serving, attaching, and showing a capture live in Tracy."

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { features = ["derive"], version = "4.6.7" }
footfall = { features = [
    "analysis",
    "export",
    "runtime",
    "session",
    "std",
    "tracing",
    "tracy",
    "wtransport",
], workspace = true }
footfall_fanout.workspace = true
footfall_memory = { features = ["std"], workspace = true }
tokio = { features = ["macros", "rt-multi-thread", "signal", "sync", "time"], version = "1.51.1" }
tracing = "0.1.41"
tracing-subscriber = { default-features = false, features = ["registry", "std"], version = "0.3.20" }

[lints]
workspace = true
