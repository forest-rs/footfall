[package]
name = "basic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
description = "Top-level examples for the Footfall workspace."

[dependencies]
footfall = { features = ["std"], workspace = true }
footfall_export.workspace = true
footfall_fanout.workspace = true
footfall_memory = { features = ["std"], workspace = true }
footfall_runtime.workspace = true
footfall_session = { features = ["std"], workspace = true }
footfall_session_wtransport.workspace = true
footfall_tracing.workspace = true
footfall_tracy.workspace = true
tokio = { features = ["macros", "rt-multi-thread", "signal", "time"], version = "1.51.1" }
tracing = "0.1.41"
tracing-subscriber = { default-features = false, features = ["registry", "std"], version = "0.3.20" }

[[bin]]
name = "basic"
path = "src/main.rs"

[[bin]]
name = "tracy_live"
path = "src/tracy_live.rs"

[[bin]]
name = "session_wtransport"
path = "src/session_wtransport.rs"

[[bin]]
name = "session_server"
path = "src/session_server.rs"

[[bin]]
name = "session_consumer"
path = "src/session_consumer.rs"

[[bin]]
name = "tracing_demo"
path = "src/tracing_demo.rs"

[lints]
workspace = true
