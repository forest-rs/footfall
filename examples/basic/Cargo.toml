[package]
name = "basic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
description = "Top-level examples for the Spoor workspace."

[dependencies]
spoor = { features = ["std"], workspace = true }
spoor_export.workspace = true
spoor_memory = { features = ["std"], workspace = true }
spoor_runtime.workspace = true
spoor_tracy.workspace = true
tracy-client = { features = ["enable", "broadcast"], workspace = true }

[[bin]]
name = "basic"
path = "src/main.rs"

[[bin]]
name = "tracy_live"
path = "src/tracy_live.rs"

[[bin]]
name = "tracy_smoke"
path = "src/tracy_smoke.rs"

[lints]
workspace = true
