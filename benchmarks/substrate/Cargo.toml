[package]
name = "footfall_benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Criterion benchmarks for Footfall substrate overhead."

[dependencies]
footfall = { features = ["std"], workspace = true }

[dev-dependencies]
criterion = { default-features = false, features = ["cargo_bench_support"], version = "0.8.2" }
footfall_export.workspace = true
footfall_fanout.workspace = true
footfall_runtime.workspace = true
footfall_tracing.workspace = true
tracing = "0.1.41"
tracing-subscriber = { default-features = false, features = ["registry", "std"], version = "0.3.20" }

[lib]
path = "src/lib.rs"
# The library only holds shared fixtures; keeping it out of `cargo bench`
# stops libtest from rejecting Criterion flags such as `--save-baseline`.
bench = false

[[bench]]
name = "none"
harness = false

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "fanout"
harness = false

[lints]
workspace = true
