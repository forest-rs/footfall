[package]
name = "footfall_runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bounded in-process capture for Footfall: counters, a window of recent events, and cursor reads that never drain."

[features]
default = ["std"]
# The runtime itself; without it, only the snapshot types.
std = ["footfall_core/std"]

[dependencies]
footfall_core = { features = ["alloc"], workspace = true }
hashbrown.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true
