[package]
name = "footfall_memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["development-tools::debugging", "development-tools::profiling", "no-std"]
description = "Scratch-buffer and cache metrics for Footfall, built on counters."

[features]
default = ["alloc"]
alloc = ["footfall_core/alloc"]
std = ["alloc", "footfall_core/std"]

[dependencies]
footfall_core.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
