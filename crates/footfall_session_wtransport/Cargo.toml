[package]
name = "footfall_session_wtransport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Serve Footfall sessions over local WebTransport, and discover, fetch, and subscribe to them."

[dependencies]
footfall_core.workspace = true
footfall_runtime = { features = ["std"], workspace = true }
footfall_session = { features = ["std"], workspace = true }
tokio = { features = ["fs", "macros", "rt", "sync", "time"], workspace = true }
tracing.workspace = true
wtransport = { features = ["quinn"], version = "0.7.2" }
x509-parser = "0.18.1"

[dev-dependencies]
tokio = { features = ["macros", "rt-multi-thread"], workspace = true }
tracing-subscriber = { features = ["fmt", "std"], workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
