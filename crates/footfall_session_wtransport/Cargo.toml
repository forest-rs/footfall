[package]
name = "footfall_session_wtransport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Serve Footfall sessions over local WebTransport, and discover, fetch, and subscribe to them."

[dependencies]
footfall_core.workspace = true
footfall_runtime.workspace = true
footfall_session = { features = ["std"], workspace = true }
tokio = { features = ["fs", "macros", "rt", "sync", "time"], version = "1.51.1" }
tracing = "0.1.41"
wtransport = { features = ["quinn"], version = "0.7.0" }
x509-parser = "0.17.0"

[dev-dependencies]
tokio = { features = ["macros", "rt-multi-thread"], version = "1.51.1" }
tracing-subscriber = { default-features = false, features = ["fmt", "std"], version = "0.3.20" }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
