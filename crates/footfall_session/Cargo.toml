[package]
name = "footfall_session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Footfall snapshots outside the process: owned snapshots, a compact versioned wire codec, and capture files."

[features]
default = ["std"]
std = ["footfall_core/std", "dep:footfall_runtime"]

[dependencies]
footfall_core.workspace = true
footfall_runtime = { optional = true, workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
