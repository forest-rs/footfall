[package]
name = "footfall_tracy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Live Tracy backend for the Footfall observability family."

[features]
default = ["enable", "broadcast"]
# `delayed-init` starts the Tracy profiler on first use, by a `TracyBackend`,
# rather than before `main` in every program that links this crate.
enable = ["tracy-client/delayed-init", "tracy-client/enable"]
broadcast = ["enable", "tracy-client/broadcast"]
ondemand = ["enable", "tracy-client/ondemand"]
only-ipv4 = ["enable", "tracy-client/only-ipv4"]
only-localhost = ["enable", "tracy-client/only-localhost"]

[dependencies]
footfall_core = { features = ["std"], workspace = true }
tracy-client = { features = [], workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
