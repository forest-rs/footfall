[package]
name = "footfall_tracy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "A Footfall backend that shows scopes, counters, and frames live in the Tracy profiler."

[features]
default = ["enable", "broadcast"]
# `manual-lifetime` starts the Tracy profiler on first use, by a
# `TracyBackend`, rather than before `main` in every program that links this
# crate.
enable = ["tracy-client/enable", "tracy-client/manual-lifetime"]
broadcast = ["enable", "tracy-client/broadcast"]
ondemand = ["enable", "tracy-client/ondemand"]
only-ipv4 = ["enable", "tracy-client/only-ipv4"]
only-localhost = ["enable", "tracy-client/only-localhost"]

[dependencies]
footfall_core = { features = ["std"], workspace = true }
# The Tracy version, which the profiler must match, is set in the workspace
# Cargo.toml; see the note there before updating these.
tracy-client = { features = [], workspace = true }
# Not used directly: depending on it pins the Tracy protocol version, which
# tracy-client alone leaves open.
tracy-client-sys = { workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
